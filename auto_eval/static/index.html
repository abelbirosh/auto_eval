<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto_Eval</title>
<style>
  /* Cream paper, hairline rules, no cards and no pills. The page should read
     like a printed spec sheet, so weight and space do the separating. */
  :root {
    --paper:  #f6f2e8;
    --ink:    #26221d;
    --muted:  #8c8376;
    --rule:   #e0d9c9;
    --rule-2: #cec5b0;
    --accent: #3f5c47;
    --ready:  #3f6b4e;
    --needs:  #8a6a22;
    --blocked:#9c4436;
    --tint:   #efe9da;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 56px 24px 100px; }

  header { display: flex; align-items: baseline; gap: 14px; }
  h1 {
    font-size: 19px; font-weight: 600; margin: 0;
    letter-spacing: .02em;
  }
  .meta {
    margin-left: auto; font-size: 11.5px; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .02em;
  }
  .sub {
    color: var(--muted); font-size: 14px; margin: 10px 0 32px;
    max-width: 62ch;
  }

  textarea {
    width: 100%; min-height: 148px; resize: vertical; padding: 0 0 14px;
    border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
    background: transparent; color: var(--ink); font: inherit; line-height: 1.6;
  }
  textarea::placeholder { color: var(--muted); opacity: .75; }
  textarea:focus { outline: 0; border-bottom-color: var(--accent); }

  .row { display: flex; gap: 22px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 14px; padding: 0; border: 0; border-radius: 0;
    background: none; cursor: pointer; color: var(--muted);
    border-bottom: 1px solid transparent; transition: color .12s, border-color .12s;
  }
  button:hover { color: var(--ink); border-bottom-color: var(--rule-2); }
  .primary { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }
  .primary:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .primary:disabled { opacity: .5; cursor: progress; border-bottom-color: transparent; }
  .hint { margin-left: auto; color: var(--muted); font-size: 12px; }

  .banner {
    margin: 0 0 24px; padding-left: 13px; font-size: 13.5px;
    border-left: 2px solid var(--rule-2); color: var(--muted);
  }
  .banner.warn { border-left-color: var(--needs); color: var(--needs); }
  .banner.err  { border-left-color: var(--blocked); color: var(--blocked); }

  section.result { margin-top: 52px; border-top: 1px solid var(--rule-2); padding-top: 28px; }
  .verdict { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  }
  .badge.ready, .badge.labelled_data { color: var(--ready); }
  .badge.needs_input, .badge.published_baselines { color: var(--needs); }
  .badge.insufficient { color: var(--blocked); }
  .badge.reference_only, .badge.none_found { color: var(--muted); }
  .verdict strong { font-size: 17px; font-weight: 600; }

  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .14em;
    color: var(--muted); font-weight: 700;
    margin: 40px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule);
  }
  h3 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:last-child td, tr:last-child th { border-bottom: 0; }
  th {
    color: var(--muted); font-weight: 600; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .1em; white-space: nowrap;
  }
  .scroll { overflow-x: auto; }
  ul { margin: 4px 0; padding-left: 17px; }
  li { margin: 3px 0; }
  li::marker { color: var(--rule-2); }

  .q { padding-left: 15px; margin: 16px 0; border-left: 1px solid var(--rule-2); }
  .q.blocking { border-left-color: var(--blocked); }
  .q .why { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .src { margin: 22px 0; }
  .src .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .src h3 { margin: 0; }
  .src a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--rule-2); }
  .src a:hover { border-bottom-color: var(--accent); }
  .tag {
    font-size: 10px; font-weight: 700; color: var(--blocked);
    text-transform: uppercase; letter-spacing: .12em; margin-left: 4px;
  }

  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  code { color: var(--muted); }
  .none { color: var(--muted); font-style: italic; }
  pre {
    background: var(--tint); padding: 16px; border-radius: 0; overflow-x: auto;
    font-size: 12.5px; line-height: 1.55; margin: 10px 0 0;
  }
  details { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12.5px; letter-spacing: .01em; }
  summary:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Auto_Eval</h1>
    <span class="meta" id="meta"></span>
  </header>
  <p class="sub">Describe something you want evaluated. The classifier pulls out what's under test, the KPIs, and the evidence &mdash; then tells you what's missing.</p>

  <div id="banner"></div>

  <div class="panel">
    <textarea id="input" placeholder="e.g. We've got a support bot that handles billing questions. Customers say it sounds robotic and it sometimes quotes the wrong refund window. I want to know if it's getting the policy right before we roll it out to the EU."></textarea>
    <div class="row">
      <button class="primary" id="go">Classify</button>
      <button class="ghost" id="example">Load example</button>
      <button class="ghost" id="clear">Clear</button>
      <span class="hint">&#8984;&#8617; to run</span>
    </div>
  </div>

  <section class="result" id="result" hidden></section>
  <section class="result" id="gtresult" hidden></section>
  <section class="result" id="exresult" hidden></section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const dash = (v) => v ? esc(v) : '<span class="none">not stated</span>';

const EXAMPLE = `We've got a support bot that handles billing questions in our chat widget. It's an agent with a few tools (lookup_account, list_invoices, issue_refund). Customers complain it sounds robotic and it occasionally quotes the wrong refund window. I want to know if it's actually getting the policy right before we roll it out to the EU. Our billing policy lives in Notion. Ideally it'd be right at least 90% of the time. We've got about six months of chat transcripts.`;

function banner(kind, msg) {
  $("banner").innerHTML = msg ? `<div class="banner ${kind}">${esc(msg)}</div>` : "";
}

async function health() {
  try {
    const r = await fetch("/api/health");
    const h = await r.json();
    $("meta").textContent = h.model;
    if (!h.has_key) banner("warn", "No OPENAI_API_KEY found. Add it to your .env, then restart the server.");
  } catch { /* server info is a nicety; the form still works */ }
}

function list(items, empty) {
  if (!items || !items.length) return `<p class="none">${esc(empty)}</p>`;
  return `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
}

let lastSpec = null;
let lastReport = null;

const OUTCOME = {
  extracted: "extracted",
  nothing_found: "nothing in it",
  unreachable: "could not read",
  unusable: "not usable",
  skipped: "skipped",
};

const PREVIEW = 300;
const preview = (t) => {
  const flat = String(t ?? "").replace(/\s+/g, " ").trim();
  return flat.length > PREVIEW ? flat.slice(0, PREVIEW).trimEnd() + " […]" : flat;
};

const COVERAGE = {
  labelled: "labelled data",
  baseline: "baseline only",
  reference: "reference only",
  none: "nothing found",
};

function render(data) {
  const s = data.spec, sub = s.subject, c = s.confidence;
  const blocking = s.open_questions.filter(q => q.blocking).length;

  const kpis = s.kpis.length ? `<div class="scroll"><table>
      <tr><th>KPI</th><th>Type</th><th>Priority</th><th>Measured by</th><th>Unit</th><th>Target</th><th>Source</th></tr>
      ${s.kpis.map(k => `<tr>
        <td><strong>${esc(k.name)}</strong><br><span class="why">${esc(k.definition)}</span></td>
        <td>${esc(k.kind)}</td><td>${esc(k.priority)}</td><td>${esc(k.measurement)}</td>
        <td>${k.unit ? esc(k.unit) : "&mdash;"}</td><td>${k.target ? esc(k.target) : "&mdash;"}</td>
        <td>${esc(k.source)}</td></tr>`).join("")}
    </table></div>`
    : `<p class="none">No KPIs identified &mdash; see the questions below.</p>`;

  const evidence = s.evidence.length ? `<div class="scroll"><table>
      <tr><th>Kind</th><th>Reference</th><th>Location</th><th>Status</th></tr>
      ${s.evidence.map(e => `<tr><td>${esc(e.kind)}</td><td>${esc(e.reference)}</td>
        <td>${e.location ? `<code>${esc(e.location)}</code>` : "&mdash;"}</td>
        <td>${esc(e.status.replace(/_/g, " "))}</td></tr>`).join("")}
    </table></div>`
    : `<p class="none">Nothing supplied &mdash; see the questions below.</p>`;

  const questions = s.open_questions.length
    ? s.open_questions.map(q => `<div class="q ${q.blocking ? "blocking" : ""}">
        <div>${esc(q.question)} ${q.blocking ? '<span class="tag">blocking</span>' : ""}</div>
        <div class="why">${esc(q.why)} &middot; <code>${esc(q.field)}</code></div>
      </div>`).join("")
    : `<p class="none">Nothing outstanding.</p>`;

  $("result").innerHTML = `
    <div class="verdict">
      <span class="badge ${esc(s.readiness)}">${esc(s.readiness.replace(/_/g, " "))}</span>
      <strong>${esc(s.title)}</strong>
      <span class="meta">${s.open_questions.length} question(s), ${blocking} blocking</span>
    </div>
    <p>${esc(s.summary)}</p>

    <h2>What we're testing</h2>
    <h3>${esc(sub.name)} <code>${esc(sub.kind)}</code></h3>
    <p>${esc(sub.description)}</p>
    <table>
      <tr><th>Interface</th><td>${dash(sub.interface)}</td></tr>
      <tr><th>Inputs</th><td>${dash(sub.inputs)}</td></tr>
      <tr><th>Outputs</th><td>${dash(sub.outputs)}</td></tr>
      <tr><th>Eval type</th><td>${s.eval_types.length ? esc(s.eval_types.join(", ")) : dash(null)}</td></tr>
      <tr><th>In scope</th><td>${list(sub.in_scope, "not stated")}</td></tr>
      <tr><th>Out of scope</th><td>${list(sub.out_of_scope, "not stated")}</td></tr>
    </table>

    <h2>How success is judged</h2>
    ${kpis}

    <h2>Evidence</h2>
    ${evidence}
    <p><strong>Ground truth:</strong> ${s.ground_truth.available
      ? esc(s.ground_truth.description || "available")
        + (s.ground_truth.sample_size ? ` (n=${esc(s.ground_truth.sample_size)})` : "")
      : '<span class="none">none identified</span>'}</p>

    <h2>Constraints</h2>${list(s.constraints, "none stated")}
    <h2>Assumptions the classifier made</h2>${list(s.assumptions, "none")}

    <h2>Open questions</h2>
    ${questions}

    <h2>Confidence</h2>
    <p class="mono">subject ${c.subject.toFixed(2)} &middot; kpis ${c.kpis.toFixed(2)} &middot; evidence ${c.evidence.toFixed(2)} &middot; overall ${c.overall.toFixed(2)}</p>

    <details><summary>Task document (markdown)</summary><pre>${esc(data.markdown)}</pre></details>
    <details><summary>Raw JSON</summary><pre>${esc(JSON.stringify(s, null, 2))}</pre></details>

    <h2>Ground truth</h2>
    ${blocking
      ? `<p class="none">Waiting on the ${blocking} blocking question(s) above &mdash; searching for
         baselines before the KPIs are settled just returns plausible noise.</p>`
      : `<p>Nothing is blocking. Search the web for datasets, benchmarks, and published
         numbers this eval could be anchored on.</p>
         <div class="row"><button class="primary" id="gt">Find ground truth</button></div>`}`;

  lastSpec = s;
  lastReport = null;
  $("gtresult").hidden = true;
  $("exresult").hidden = true;
  const gtBtn = $("gt");
  if (gtBtn) gtBtn.onclick = groundTruth;
  $("result").hidden = false;
}

function renderReport(data) {
  const r = data.report;

  const coverage = r.kpi_coverage.length ? `<div class="scroll"><table>
      <tr><th>KPI</th><th>What exists</th><th>Sources</th></tr>
      ${r.kpi_coverage.map(k => `<tr><td>${esc(k.kpi)}</td>
        <td>${esc(COVERAGE[k.coverage] || k.coverage)}</td>
        <td>${k.sources.length ? esc(k.sources.join(", ")) : "&mdash;"}</td></tr>`).join("")}
    </table></div>`
    : `<p class="none">No KPIs to cover.</p>`;

  const sources = r.sources.length ? r.sources.map(src => `<div class="src">
      <div class="head"><h3>${esc(src.name)}</h3>
        <code>${esc(src.kind)}</code>
        <span class="meta">fit ${esc(src.fit)} &middot; access ${esc(src.access)}${
          src.licence ? " &middot; " + esc(src.licence) : ""}</span></div>
      <p>${esc(src.description)}</p>
      <p><a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">${esc(src.url)}</a></p>
      ${src.covers_kpis.length ? `<p class="why">Covers: ${esc(src.covers_kpis.join(", "))}</p>` : ""}
      ${src.baselines.length ? `<div class="scroll"><table>
        <tr><th>Metric</th><th>Value</th><th>System</th><th>As of</th></tr>
        ${src.baselines.map(b => `<tr><td>${esc(b.metric)}</td><td>${esc(b.value)}</td>
          <td>${b.system ? esc(b.system) : "&mdash;"}</td>
          <td>${b.as_of ? esc(b.as_of) : "&mdash;"}</td></tr>`).join("")}
       </table></div>` : ""}
      ${src.caveats ? `<p class="why">Caveat: ${esc(src.caveats)}</p>` : ""}
    </div>`).join("")
    : `<p class="none">Nothing usable found online for this task.</p>`;

  $("gtresult").innerHTML = `
    <div class="verdict">
      <span class="badge ${esc(r.verdict)}">${esc(r.verdict.replace(/_/g, " "))}</span>
      <strong>Ground truth for ${esc(r.subject)}</strong>
      <span class="meta">${r.sources.length} source(s)</span>
    </div>
    <p>${esc(r.recommendation)}</p>
    <p class="why">${r.internal_ground_truth
      ? "You already hold your own labels, so these are for comparison rather than scoring."
      : "You hold no labels of your own, so anything usable below saves labelling work."}</p>

    <h2>Coverage by KPI</h2>${coverage}
    <h2>Sources</h2>${sources}
    <h2>Notes</h2>${list(r.notes, "none")}
    <h2>Searches run</h2>${list(r.searches, "none recorded")}

    <details><summary>Report (markdown)</summary><pre>${esc(data.markdown)}</pre></details>
    <details><summary>Raw JSON</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>

    <h2>Extraction</h2>
    ${r.sources.length
      ? `<p>Fetch these sources and pull out the labelled cases themselves. Dataset rows
         come straight from the dataset API; anything read off a page is checked back
         against that page before it is kept.</p>
         <div class="row"><button class="primary" id="ex">Extract ground truth</button></div>`
      : `<p class="none">No sources to extract from.</p>`}`;

  lastReport = r;
  $("exresult").hidden = true;
  const exBtn = $("ex");
  if (exBtn) exBtn.onclick = runExtract;
  $("gtresult").hidden = false;
}

function renderSet(data) {
  const f = data.found;

  const cases = f.examples.length ? `<div class="scroll"><table>
      <tr><th>Input</th><th>Expected</th><th>KPI</th><th>From</th></tr>
      ${f.examples.map(e => `<tr>
        <td>${esc(preview(e.input))}</td><td>${esc(preview(e.expected))}</td>
        <td>${e.kpi ? esc(e.kpi) : "&mdash;"}</td>
        <td>${esc(e.source)}<br><span class="why">${esc(e.origin.replace(/_/g, " "))}${
          e.split ? " &middot; " + esc(e.split) : ""}</span></td></tr>`).join("")}
    </table></div>`
    : `<p class="none">No labelled cases extracted.</p>`;

  const numbers = f.baselines.length ? `<div class="scroll"><table>
      <tr><th>Metric</th><th>Value</th><th>System</th><th>As of</th><th>Quoted from</th></tr>
      ${f.baselines.map(b => `<tr><td>${esc(b.metric)}</td><td>${esc(b.value)}</td>
        <td>${b.system ? esc(b.system) : "&mdash;"}</td>
        <td>${b.as_of ? esc(b.as_of) : "&mdash;"}</td>
        <td>${esc(preview(b.quote))}<br><span class="why">${esc(b.source)}</span></td></tr>`).join("")}
    </table></div>`
    : `<p class="none">No published numbers survived checking.</p>`;

  $("exresult").innerHTML = `
    <div class="verdict">
      <span class="badge ${f.examples.length || f.baselines.length ? "labelled_data" : "none_found"}">
        ${f.examples.length} case(s)</span>
      <strong>Extracted ground truth</strong>
      <span class="meta">${f.baselines.length} baseline(s) &middot; ${f.outcomes.length} source(s) tried</span>
    </div>

    <h2>Labelled cases</h2>${cases}
    <h2>Published baselines</h2>${numbers}

    <h2>What each source gave</h2>
    <div class="scroll"><table>
      <tr><th>Source</th><th>Result</th><th>Cases</th><th>Numbers</th><th>Discarded</th><th>Detail</th></tr>
      ${f.outcomes.map(o => `<tr><td>${esc(o.source)}</td>
        <td>${esc(OUTCOME[o.outcome] || o.outcome)}</td><td>${o.examples}</td>
        <td>${o.baselines}</td><td>${o.discarded}</td>
        <td><span class="why">${esc(o.detail)}</span></td></tr>`).join("")}
    </table></div>

    <h2>Notes</h2>${list(f.notes, "none")}

    <details><summary>Cases as JSONL</summary><pre>${esc(
      f.examples.map(e => JSON.stringify(e)).join("\n") || "(none)")}</pre></details>
    <details><summary>Report (markdown)</summary><pre>${esc(data.markdown)}</pre></details>`;
  $("exresult").hidden = false;
}

async function runExtract() {
  if (!lastSpec || !lastReport) return;
  const btn = $("ex");
  btn.disabled = true;
  btn.textContent = "Fetching sources\u2026";
  banner("", "");

  try {
    const r = await fetch("/api/extract", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ spec: lastSpec, report: lastReport }),
    });
    const body = await r.json();
    if (!r.ok) { banner("err", body.detail || `Request failed (${r.status})`); return; }
    renderSet(body);
    $("exresult").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    banner("err", `Could not reach the server: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "Extract ground truth";
  }
}

async function groundTruth() {
  if (!lastSpec) return;
  const btn = $("gt");
  btn.disabled = true;
  btn.textContent = "Searching\u2026";
  banner("", "");

  try {
    const r = await fetch("/api/ground-truth", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ spec: lastSpec }),
    });
    const body = await r.json();
    if (!r.ok) { banner("err", body.detail || `Request failed (${r.status})`); return; }
    renderReport(body);
    $("gtresult").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    banner("err", `Could not reach the server: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "Find ground truth";
  }
}

async function run() {
  const text = $("input").value.trim();
  if (!text) { banner("err", "Type a request first."); return; }

  const btn = $("go");
  btn.disabled = true;
  btn.textContent = "Classifying\u2026";
  banner("", "");

  try {
    const r = await fetch("/api/classify", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const body = await r.json();
    if (!r.ok) { banner("err", body.detail || `Request failed (${r.status})`); return; }
    render(body);
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    banner("err", `Could not reach the server: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "Classify";
  }
}

$("go").onclick = run;
$("example").onclick = () => { $("input").value = EXAMPLE; $("input").focus(); };
$("clear").onclick = () => {
  $("input").value = "";
  $("result").hidden = true;
  $("gtresult").hidden = true;
  $("exresult").hidden = true;
  lastSpec = null;
  lastReport = null;
  banner("", "");
};
$("input").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
});
health();
</script>
</body>
</html>
