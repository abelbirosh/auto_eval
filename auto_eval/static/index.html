<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto_Eval</title>
<style>
  /* Cream paper, hairline rules, no cards and no pills. The page should read
     like a printed spec sheet, so weight and space do the separating. */
  :root {
    --paper:  #f6f2e8;
    --ink:    #26221d;
    --muted:  #8c8376;
    --rule:   #e0d9c9;
    --rule-2: #cec5b0;
    --accent: #3f5c47;
    --ready:  #3f6b4e;
    --needs:  #8a6a22;
    --blocked:#9c4436;
    --tint:   #efe9da;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 56px 24px 100px; }

  header { display: flex; align-items: baseline; gap: 14px; }
  h1 {
    font-size: 19px; font-weight: 600; margin: 0;
    letter-spacing: .02em;
  }
  .meta {
    margin-left: auto; font-size: 11.5px; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .02em;
  }
  .sub {
    color: var(--muted); font-size: 14px; margin: 10px 0 32px;
    max-width: 62ch;
  }

  textarea {
    width: 100%; min-height: 148px; resize: vertical; padding: 0 0 14px;
    border: 0; border-bottom: 1px solid var(--rule-2); border-radius: 0;
    background: transparent; color: var(--ink); font: inherit; line-height: 1.6;
  }
  textarea::placeholder { color: var(--muted); opacity: .75; }
  textarea:focus { outline: 0; border-bottom-color: var(--accent); }

  .row { display: flex; gap: 22px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 14px; padding: 0; border: 0; border-radius: 0;
    background: none; cursor: pointer; color: var(--muted);
    border-bottom: 1px solid transparent; transition: color .12s, border-color .12s;
  }
  button:hover { color: var(--ink); border-bottom-color: var(--rule-2); }
  .primary { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }
  .primary:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .primary:disabled { opacity: .5; cursor: progress; border-bottom-color: transparent; }
  .hint { margin-left: auto; color: var(--muted); font-size: 12px; }

  .banner {
    margin: 0 0 24px; padding-left: 13px; font-size: 13.5px;
    border-left: 2px solid var(--rule-2); color: var(--muted);
  }
  .banner.warn { border-left-color: var(--needs); color: var(--needs); }
  .banner.err  { border-left-color: var(--blocked); color: var(--blocked); }

  section.result { margin-top: 52px; border-top: 1px solid var(--rule-2); padding-top: 28px; }
  .verdict { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  }
  .badge.ready, .badge.labelled_data { color: var(--ready); }
  .badge.needs_input, .badge.published_baselines { color: var(--needs); }
  .badge.insufficient { color: var(--blocked); }
  .badge.reference_only, .badge.none_found { color: var(--muted); }
  .verdict strong { font-size: 17px; font-weight: 600; }

  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .14em;
    color: var(--muted); font-weight: 700;
    margin: 40px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule);
  }
  h3 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tr:last-child td, tr:last-child th { border-bottom: 0; }
  th {
    color: var(--muted); font-weight: 600; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .1em; white-space: nowrap;
  }
  .scroll { overflow-x: auto; }
  ul { margin: 4px 0; padding-left: 17px; }
  li { margin: 3px 0; }
  li::marker { color: var(--rule-2); }

  .q { padding-left: 15px; margin: 16px 0; border-left: 1px solid var(--rule-2); }
  .q.blocking { border-left-color: var(--blocked); }
  .q .why { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .q textarea {
    min-height: 0; margin-top: 8px; padding: 4px 0 8px; font-size: 14px;
  }
  /* The board form: items and systems, pasted in. */
  #b-items, #b-cohort {
    min-height: 0; margin-top: 6px; padding: 8px 10px; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.5;
    background: var(--tint); border: 0; border-bottom: 1px solid var(--rule-2);
  }
  input[type=text] {
    font: inherit; font-size: 13px; color: var(--ink); background: transparent;
    border: 0; border-bottom: 1px solid var(--rule-2); padding: 1px 0;
  }
  input[type=text]:focus { outline: 0; border-bottom-color: var(--accent); }
  .q textarea.filled { border-bottom-color: var(--ready); }
  /* Disabled here means "not filled in yet", not "working". */
  #answer:disabled { cursor: not-allowed; }

  /* The summary block: a handful of lines, everything else folded away. */
  table.facts th { width: 96px; }
  table.facts td, table.facts th { border-bottom: 0; padding: 3px 14px 3px 0; }
  .sep { color: var(--rule-2); }
  .src { margin: 22px 0; }
  .src .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .src h3 { margin: 0; }
  .src a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--rule-2); }
  .src a:hover { border-bottom-color: var(--accent); }
  .tag {
    font-size: 10px; font-weight: 700; color: var(--blocked);
    text-transform: uppercase; letter-spacing: .12em; margin-left: 4px;
  }

  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  code { color: var(--muted); }
  .none { color: var(--muted); font-style: italic; }
  pre {
    background: var(--tint); padding: 16px; border-radius: 0; overflow-x: auto;
    font-size: 12.5px; line-height: 1.55; margin: 10px 0 0;
  }
  /* Run verdicts: three words that always mean the same thing. */
  .badge.passed { color: var(--ready); }
  .badge.failed, .badge.error { color: var(--blocked); }
  .badge.blocked { color: var(--needs); }

  /* The benchmark form: four decisions, on one line. */
  .row label { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  input[type=number], select {
    font: inherit; font-size: 13px; color: var(--ink); background: transparent;
    border: 0; border-bottom: 1px solid var(--rule-2); padding: 1px 0; width: 74px;
  }
  select { width: auto; }
  input[type=number]:focus, select:focus { outline: 0; border-bottom-color: var(--accent); }

  details { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 14px; }
  details.inline { margin: 0; border-top: 0; padding-top: 0; }
  details.inline ul { margin-top: 6px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12.5px; letter-spacing: .01em; }
  summary:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Auto_Eval</h1>
    <span class="meta" id="meta"></span>
  </header>
  <p class="sub">Describe something you want evaluated. The classifier pulls out what's under test, the KPIs, and the evidence &mdash; then tells you what's missing.</p>

  <div id="banner"></div>

  <div class="panel">
    <textarea id="input" placeholder="e.g. We've got a support bot that handles billing questions. Customers say it sounds robotic and it sometimes quotes the wrong refund window. I want to know if it's getting the policy right before we roll it out to the EU."></textarea>
    <div class="row">
      <button class="primary" id="go">Classify</button>
      <button class="ghost" id="example">Load example</button>
      <button class="ghost" id="clear">Clear</button>
      <span class="hint">&#8984;&#8617; to run</span>
    </div>
  </div>

  <section class="result" id="result" hidden></section>
  <section class="result" id="gtresult" hidden></section>
  <section class="result" id="exresult" hidden></section>
  <section class="result" id="runresult" hidden></section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const dash = (v) => v ? esc(v) : '<span class="none">not stated</span>';
const words = (s) => esc(String(s ?? "").replace(/_/g, " "));

const EXAMPLE = `We've got a support bot that handles billing questions in our chat widget. It's an agent with a few tools (lookup_account, list_invoices, issue_refund). Customers complain it sounds robotic and it occasionally quotes the wrong refund window. I want to know if it's actually getting the policy right before we roll it out to the EU. Our billing policy lives in Notion. Ideally it'd be right at least 90% of the time. We've got about six months of chat transcripts.`;

function banner(kind, msg) {
  $("banner").innerHTML = msg ? `<div class="banner ${kind}">${esc(msg)}</div>` : "";
}

let healthState = null;

async function health() {
  try {
    const r = await fetch("/api/health");
    const h = await r.json();
    healthState = h;
    $("meta").textContent = h.model;
    if (!h.has_key) banner("warn", "No OPENAI_API_KEY found. Add it to your .env, then restart the server.");
  } catch { /* server info is a nicety; the form still works */ }
}

function list(items, empty) {
  if (!items || !items.length) return `<p class="none">${esc(empty)}</p>`;
  return `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
}

let lastSpec = null;
let lastReport = null;
let lastText = "";
// Questions from the spec on screen, and every answer typed so far. Answers
// accumulate across rounds: a question that stops being asked keeps the reply
// that settled it, so the next classification still sees it.
let questions = [];
let answered = [];

const filled = (i) => !!($("ans" + i) && $("ans" + i).value.trim());
const answeredFor = (q) => {
  const hit = answered.find(a => a.question === q.question);
  return hit ? hit.answer : "";
};

function collectAnswers() {
  const merged = answered.slice();
  questions.forEach((q, i) => {
    const box = $("ans" + i);
    const answer = box ? box.value.trim() : "";
    if (!answer) return;
    const at = merged.findIndex(a => a.question === q.question);
    const entry = { field: q.field, question: q.question, answer };
    if (at === -1) merged.push(entry); else merged[at] = entry;
  });
  return merged;
}

const REACH = {
  ok: "reachable",
  unreachable: "could not read",
  blocked: "blocked",
  not_checked: "not opened",
};

const USABILITY = {
  ground_truth: "labelled data behind it",
  baselines: "numbers to compare against",
  background: "background only",
  unusable: "not usable",
};

const PREVIEW = 300;
const preview = (t) => {
  const flat = String(t ?? "").replace(/\s+/g, " ").trim();
  return flat.length > PREVIEW ? flat.slice(0, PREVIEW).trimEnd() + " […]" : flat;
};

const COVERAGE = {
  labelled: "labelled data",
  baseline: "baseline only",
  reference: "reference only",
  none: "nothing found",
};

function questionBox(q, i) {
  const answer = answeredFor(q);
  return `<div class="q ${q.blocking ? "blocking" : ""}">
      <div>${esc(q.question)} ${q.blocking ? '<span class="tag">blocking</span>' : ""}</div>
      <div class="why">${esc(q.why)} &middot; <code>${esc(q.field)}</code></div>
      <textarea id="ans${i}" data-i="${i}" rows="2" placeholder="${
        q.blocking ? "Required" : "Optional"}">${esc(answer)}</textarea>
    </div>`;
}

// The first read should be short: a verdict, a handful of lines, and whatever
// is standing in the way. The tables that used to be here are still one click
// down, under "Full spec".
function render(data) {
  const s = data.spec, sub = s.subject, c = s.confidence;
  questions = s.open_questions;
  const blocking = questions.filter(q => q.blocking);

  const kpiLine = s.kpis.length
    ? s.kpis.map(k => `${esc(k.name)}${k.target ? ` <span class="why">${esc(k.target)}</span>` : ""}${
        k.source === "inferred" ? ' <span class="why">assumed</span>' : ""}`)
        .join(' <span class="sep">/</span> ')
    : '<span class="none">nothing to score yet</span>';

  const held = s.evidence.filter(e => e.status === "provided").length;
  const named = s.evidence.filter(e => e.status === "mentioned_not_provided").length;
  const evidenceBits = [];
  if (held) evidenceBits.push(`${held} in hand`);
  if (named) evidenceBits.push(`${named} referenced, not supplied`);
  if (s.ground_truth.available) {
    evidenceBits.push("ground truth" + (s.ground_truth.sample_size
      ? ` (n=${esc(s.ground_truth.sample_size)})` : ""));
  }
  const evidenceLine = evidenceBits.length
    ? evidenceBits.join(' <span class="sep">/</span> ')
    : '<span class="none">nothing supplied</span>';

  const answerForm = blocking.length
    ? `<h2>Answer to unblock</h2>
       <p>${blocking.length} answer(s) needed. Fill every box below and the spec is
          classified again with them &mdash; that is what clears the block.</p>
       ${questions.map((q, i) => q.blocking ? questionBox(q, i) : "").join("")}
       ${questions.some(q => !q.blocking)
         ? `<details><summary>${questions.filter(q => !q.blocking).length} other question(s)
              &mdash; optional, but they sharpen the spec</summary>
            ${questions.map((q, i) => q.blocking ? "" : questionBox(q, i)).join("")}</details>`
         : ""}
       <div class="row">
         <button class="primary" id="answer">Submit answers</button>
         <span class="hint" id="answer-hint"></span>
       </div>`
    : `<h2>Ground truth</h2>
       <p>Nothing is blocking. Search the web for datasets, benchmarks, and published
          numbers this eval could be anchored on.</p>
       <div class="row"><button class="primary" id="gt">Find ground truth</button></div>
       ${questions.length
         ? `<details><summary>${questions.length} open question(s)
              &mdash; optional, but they sharpen the spec</summary>
            ${questions.map(questionBox).join("")}
            <div class="row">
              <button class="primary" id="answer">Submit answers</button>
              <span class="hint" id="answer-hint"></span>
            </div></details>`
         : ""}`;

  $("result").innerHTML = `
    <div class="verdict">
      <span class="badge ${esc(s.readiness)}">${esc(s.readiness.replace(/_/g, " "))}</span>
      <strong>${esc(s.title)}</strong>
      <span class="meta">${questions.length} question(s), ${blocking.length} blocking</span>
    </div>
    <p>${esc(s.summary)}</p>
    <table class="facts">
      <tr><th>Testing</th><td>${esc(sub.name)} <code>${esc(sub.kind)}</code></td></tr>
      <tr><th>Judged on</th><td>${kpiLine}</td></tr>
      <tr><th>Evidence</th><td>${evidenceLine}</td></tr>
      ${s.assumptions.length ? `<tr><th>Filled in</th><td>
        <details class="inline"><summary>${s.assumptions.length} thing(s) worked out
          from the request &mdash; correct any of them in the questions below</summary>
          ${list(s.assumptions, "")}</details></td></tr>` : ""}
    </table>

    ${answerForm}

    <details><summary>Full spec</summary>
      <h2>What we're testing</h2>
      <h3>${esc(sub.name)} <code>${esc(sub.kind)}</code></h3>
      <p>${esc(sub.description)}</p>
      <table>
        <tr><th>Interface</th><td>${dash(sub.interface)}</td></tr>
        <tr><th>Inputs</th><td>${dash(sub.inputs)}</td></tr>
        <tr><th>Outputs</th><td>${dash(sub.outputs)}</td></tr>
        <tr><th>Eval type</th><td>${s.eval_types.length ? esc(s.eval_types.join(", ")) : dash(null)}</td></tr>
        <tr><th>In scope</th><td>${list(sub.in_scope, "not stated")}</td></tr>
        <tr><th>Out of scope</th><td>${list(sub.out_of_scope, "not stated")}</td></tr>
      </table>

      <h2>How success is judged</h2>
      ${s.kpis.length ? `<div class="scroll"><table>
          <tr><th>KPI</th><th>Type</th><th>Priority</th><th>Measured by</th><th>Unit</th><th>Target</th><th>Source</th></tr>
          ${s.kpis.map(k => `<tr>
            <td><strong>${esc(k.name)}</strong><br><span class="why">${esc(k.definition)}</span></td>
            <td>${esc(k.kind)}</td><td>${esc(k.priority)}</td><td>${esc(k.measurement)}</td>
            <td>${k.unit ? esc(k.unit) : "&mdash;"}</td><td>${k.target ? esc(k.target) : "&mdash;"}</td>
            <td>${esc(k.source)}</td></tr>`).join("")}
        </table></div>`
        : `<p class="none">No KPIs identified &mdash; see the questions above.</p>`}

      <h2>Evidence</h2>
      ${s.evidence.length ? `<div class="scroll"><table>
          <tr><th>Kind</th><th>Reference</th><th>Location</th><th>Status</th></tr>
          ${s.evidence.map(e => `<tr><td>${esc(e.kind)}</td><td>${esc(e.reference)}</td>
            <td>${e.location ? `<code>${esc(e.location)}</code>` : "&mdash;"}</td>
            <td>${esc(e.status.replace(/_/g, " "))}</td></tr>`).join("")}
        </table></div>`
        : `<p class="none">Nothing supplied &mdash; see the questions above.</p>`}
      <p><strong>Ground truth:</strong> ${s.ground_truth.available
        ? esc(s.ground_truth.description || "available")
          + (s.ground_truth.sample_size ? ` (n=${esc(s.ground_truth.sample_size)})` : "")
        : '<span class="none">none identified</span>'}</p>

      <h2>Constraints</h2>${list(s.constraints, "none stated")}
      <h2>Assumptions the classifier made</h2>${list(s.assumptions, "none")}

      <h2>Confidence</h2>
      <p class="mono">subject ${c.subject.toFixed(2)} &middot; kpis ${c.kpis.toFixed(2)} &middot; evidence ${c.evidence.toFixed(2)} &middot; overall ${c.overall.toFixed(2)}</p>
    </details>
    <details><summary>Task document (markdown)</summary><pre>${esc(data.markdown)}</pre></details>
    <details><summary>Raw JSON</summary><pre>${esc(JSON.stringify(s, null, 2))}</pre></details>`;

  lastSpec = s;
  lastReport = null;
  $("gtresult").hidden = true;
  $("exresult").hidden = true;
  $("runresult").hidden = true;
  const gtBtn = $("gt");
  if (gtBtn) gtBtn.onclick = groundTruth;
  wireAnswers(questions);
  $("result").hidden = false;
}

// Every box reports back as it is typed in, so the submit button is only live
// once each blocking question has something in it.
function wireAnswers(questions) {
  const btn = $("answer");
  if (!btn) return;
  btn.onclick = submitAnswers;
  questions.forEach((q, i) => {
    const box = $("ans" + i);
    if (box) box.oninput = () => { box.classList.toggle("filled", !!box.value.trim()); answerState(); };
    if (box) box.classList.toggle("filled", !!box.value.trim());
  });
  answerState();
}

function answerState() {
  const btn = $("answer");
  if (!btn) return;
  let blocking = 0, outstanding = 0, given = 0;
  questions.forEach((q, i) => {
    if (filled(i)) given += 1;
    if (!q.blocking) return;
    blocking += 1;
    if (!filled(i)) outstanding += 1;
  });
  // Every blocking box must be filled; with nothing blocking, one answer is
  // enough to be worth another pass.
  btn.disabled = blocking ? outstanding > 0 : given === 0;
  const hint = $("answer-hint");
  if (hint) {
    hint.textContent = outstanding
      ? `${outstanding} of ${blocking} still to answer`
      : (btn.disabled ? "" : "ready to re-classify");
  }
}

// Tables wherever a table will do. Everything that reads as prose - a
// description, a caveat, a quoted span - folds away under one summary, so the
// first screen is the shape of the answer rather than the whole of it.
const cell = (v) => v === null || v === undefined || v === "" ? "&mdash;" : esc(v);
const link = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text || url)}</a>`;
const host = (url) => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; } };
const table = (headers, rows) => `<div class="scroll"><table>
  <tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr>
  ${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;

function renderReport(data) {
  const r = data.report;

  const coverage = r.kpi_coverage.length
    ? table(["KPI", "What exists", "Sources"], r.kpi_coverage.map(k =>
        [esc(k.kpi), esc(COVERAGE[k.coverage] || k.coverage),
         k.sources.length ? esc(k.sources.join(", ")) : "&mdash;"]))
    : `<p class="none">No KPIs to cover.</p>`;

  const sources = r.sources.length
    ? table(["Source", "Kind", "Fit", "Access", "Published", "Covers", "Baselines"],
        r.sources.map(src => [
          link(src.url, src.name),
          cell(src.kind),
          cell(src.fit),
          cell(src.access),
          cell(src.released),
          src.covers_kpis.length ? esc(src.covers_kpis.join(", ")) : "&mdash;",
          src.baselines.length ? `${src.baselines.length}` : "&mdash;",
        ]))
    : `<p class="none">Nothing usable found online for this task.</p>`;

  const detail = r.sources.map(src => `<div class="src">
      <div class="head"><h3>${esc(src.name)}</h3><code>${esc(src.kind)}</code>
        <span class="meta">${src.publisher ? esc(src.publisher) : ""}${
          src.licence ? " &middot; " + esc(src.licence) : ""}</span></div>
      <p>${esc(src.description)}</p>
      ${src.baselines.length ? table(["Metric", "Value", "System", "As of"],
        src.baselines.map(b => [esc(b.metric), esc(b.value), cell(b.system), cell(b.as_of)])) : ""}
      ${src.caveats ? `<p class="why">Caveat: ${esc(src.caveats)}</p>` : ""}
    </div>`).join("");

  $("gtresult").innerHTML = `
    <div class="verdict">
      <span class="badge ${esc(r.verdict)}">${esc(r.verdict.replace(/_/g, " "))}</span>
      <strong>Ground truth for ${esc(r.subject)}</strong>
      <span class="meta">${r.sources.length} source(s) &middot; ${r.searches.length} search(es)</span>
    </div>
    <table class="facts">
      <tr><th>Use</th><td>${esc(r.recommendation || "no recommendation returned")}</td></tr>
      <tr><th>Own labels</th><td>${r.internal_ground_truth
        ? "yes &mdash; public sources are for comparison, not scoring"
        : "none &mdash; anything usable below saves labelling work"}</td></tr>
    </table>

    <h2>Coverage by KPI</h2>${coverage}
    <h2>Sources</h2>${sources}
    ${r.notes.length ? `<details><summary>${r.notes.length} note(s) on how to read these</summary>${list(r.notes, "")}</details>` : ""}
    ${r.sources.length ? `<details><summary>What each source is, and its caveats</summary>${detail}</details>` : ""}
    ${r.searches.length ? `<details><summary>Searches run</summary>${list(r.searches, "none recorded")}</details>` : ""}
    <details><summary>Report (markdown)</summary><pre>${esc(data.markdown)}</pre></details>
    <details><summary>Raw JSON</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>

    <h2>Look inside the sources</h2>
    ${r.sources.length
      ? `<p class="why">Opens each link and reports what is really behind it &mdash; columns,
         splits, licence, gating. Nothing is downloaded.</p>
         <div class="row"><button class="primary" id="ex">Analyze sources</button></div>`
      : `<p class="none">No sources to analyse.</p>`}

    ${benchmarkForm()}`;

  lastReport = r;
  $("exresult").hidden = true;
  $("runresult").hidden = true;
  const exBtn = $("ex");
  if (exBtn) exBtn.onclick = runAnalyze;
  wireBenchmark();
  $("gtresult").hidden = false;
}

function renderAnalysis(data) {
  const a = data.analysis;
  const plans = a.resources.filter(r => r.plan).map(r => r.plan);

  const resources = a.resources.length
    ? table(["Source", "Link", "Reachable", "What is behind it", "Effort", "To fetch later"],
        a.resources.map(r => [
          esc(r.source) + (r.covers_kpis.length ? `<br><span class="why">${esc(r.covers_kpis.join(", "))}</span>` : ""),
          link(r.url, host(r.url)),
          esc(REACH[r.reachability] || r.reachability),
          esc(USABILITY[r.usability] || r.usability),
          cell(r.effort),
          r.plan ? esc(r.plan.what) + (r.plan.blockers ? `<br><span class="why">in the way: ${esc(r.plan.blockers)}</span>` : "") : "&mdash;",
        ]))
    : `<p class="none">Nothing to analyse.</p>`;

  const datasets = a.resources.filter(r => r.dataset);
  const datasetTable = datasets.length
    ? table(["Source", "Columns", "Splits", "Licence", "Gated", "Downloads", "Last modified"],
        datasets.map(r => [
          esc(r.source),
          r.dataset.columns.length ? esc(r.dataset.columns.join(", ")) : "&mdash;",
          r.dataset.splits.length
            ? esc(r.dataset.splits.map(s => s.rows ? `${s.name} (${s.rows.toLocaleString()})` : s.name).join(", "))
            : "&mdash;",
          cell(r.dataset.licence),
          r.dataset.gated ? "yes" : "no",
          r.dataset.downloads != null ? r.dataset.downloads.toLocaleString() : "&mdash;",
          cell(r.dataset.last_modified),
        ]))
    : "";

  const quotes = a.resources.filter(r => r.baselines.length).map(r => `<div class="src">
      <h3>${esc(r.source)}</h3>
      ${table(["Metric", "Value", "System", "As of", "Quoted from"],
        r.baselines.map(b => [esc(b.metric), esc(b.value), cell(b.system), cell(b.as_of),
          `<span class="why">${esc(preview(b.quote))}</span>`]))}
    </div>`).join("");

  const caveats = a.resources.filter(r => r.caveats.length || r.discarded).map(r =>
    `<div class="src"><h3>${esc(r.source)}</h3>
      ${r.discarded ? `<p class="why">${r.discarded} claim(s) discarded: the page did not bear them out.</p>` : ""}
      ${r.caveats.length ? list(r.caveats, "") : ""}</div>`).join("");

  const withData = a.resources.filter(r => r.usability === "ground_truth").length;

  $("exresult").innerHTML = `
    <div class="verdict">
      <span class="badge ${withData ? "labelled_data" : "none_found"}">${withData} with data</span>
      <strong>Source analysis</strong>
      <span class="meta">${a.resources.length} opened &middot; ${plans.length} worth fetching &middot; nothing downloaded</span>
    </div>
    ${resources}
    ${datasetTable ? `<h2>What the datasets hold</h2>${datasetTable}` : ""}
    ${quotes ? `<details><summary>Baseline numbers, with the line each was quoted from</summary>${quotes}</details>` : ""}
    ${caveats ? `<details><summary>Caveats and discarded claims</summary>${caveats}</details>` : ""}
    ${a.notes.length ? `<details><summary>${a.notes.length} note(s)</summary>${list(a.notes, "")}</details>` : ""}
    <details><summary>Fetch plan (JSON)</summary><pre>${esc(JSON.stringify(plans, null, 2))}</pre></details>
    <details><summary>Analysis (markdown)</summary><pre>${esc(data.markdown)}</pre></details>`;
  $("exresult").hidden = false;
}

async function runAnalyze() {
  if (!lastSpec || !lastReport) return;
  const btn = $("ex");
  btn.disabled = true;
  btn.textContent = "Opening sources\u2026";
  banner("", "");

  try {
    const r = await fetch("/api/analyze", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ spec: lastSpec, report: lastReport }),
    });
    const body = await r.json();
    if (!r.ok) { banner("err", body.detail || `Request failed (${r.status})`); return; }
    renderAnalysis(body);
    $("exresult").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    banner("err", `Could not reach the server: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "Analyze sources";
  }
}

// --- the benchmark ------------------------------------------------------
// Everything from here is mechanical: the suite is written from the spec by
// rule, and then every case is run. So it is one button, with the four things
// worth deciding next to it.

// Two shapes of subject, two shapes of benchmark. An agent has a trajectory, so
// it gets a suite of cases and is scored on what it did. An endpoint or a model
// has no trajectory: what you want to know is which of several systems answers
// the same questions best, which is a board.
const AGENTIC = ["agent", "workflow"];
const isAgentic = () => lastSpec && AGENTIC.includes(lastSpec.subject.kind);

function starterCohort() {
  const model = (healthState && healthState.subject_model) || "gpt-5-mini";
  return JSON.stringify({
    name: (lastSpec && lastSpec.subject.name ? lastSpec.subject.name : "cohort")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""),
    task: lastSpec && lastSpec.subject.in_scope && lastSpec.subject.in_scope.length
      ? lastSpec.subject.in_scope[0] : "factual lookup",
    model,
    systems: [{
      label: "Vendor A",
      vendor: "Vendor A",
      kind: "search_api",
      configuration: "POST /search",
      endpoint: {
        method: "POST",
        url: "https://api.vendor-a.example/search",
        headers: { "x-api-key": "${VENDOR_A_API_KEY}" },
        body: { query: "{query}", numResults: 10 },
        results_path: "results",
        fields: { title: "title", url: "url", snippet: "text" }
      },
      price: { per_call_usd: 0.005, note: "$5 / 1k", source: "https://vendor-a.example/pricing" }
    }]
  }, null, 2);
}

function benchmarkForm() {
  if (isAgentic()) {
    return `<h2>Benchmark</h2>
      <p class="why">Writes the suite for this spec &mdash; offline, deterministic, same spec
        same suite &mdash; then runs every case against the provider and scores it.</p>
      <div class="row">
        <label>samples <input type="number" id="b-samples" min="1" max="10" placeholder="auto"></label>
        <label>first N cases <input type="number" id="b-limit" min="1" placeholder="all"></label>
        <label>split <select id="b-split">
          <option value="">all</option><option value="held_out">held out</option><option value="dev">dev</option>
        </select></label>
        <label><input type="checkbox" id="b-mock"> dry run (no provider call)</label>
      </div>
      <div class="row">
        <button class="primary" id="test">Run the benchmark</button>
        <span class="hint" id="test-hint"></span>
      </div>`;
  }

  const datasets = lastReport
    ? lastReport.sources.filter(s => s.kind === "dataset" || s.kind === "benchmark")
    : [];

  return `<h2>Benchmark</h2>
    <p class="why">A <strong>${esc(lastSpec.subject.kind.replace(/_/g, " "))}</strong> has no trajectory to
      score, so this is a board: the same items put to every system, one row each, with a
      model-only row to show the answers could not simply be recalled.</p>

    <table class="facts">
      <tr><th>Items</th><td>One JSON object per line, each with a question and the answers that
        count. A date on each item is what makes the contamination check work.
        ${datasets.length ? `<br><span class="why">From the search above: ${
          datasets.map(d => link(d.url, d.name)).join(", ")} &mdash; fetch what you need and paste the rows here.</span>` : ""}</td></tr>
      <tr><th>Systems</th><td>One row per vendor and configuration. Keys are read from the
        environment as <code>\${VENDOR_API_KEY}</code> and never stored here; a row whose key is
        missing is reported as not run rather than scored as bad.</td></tr>
    </table>

    <h3>Items</h3>
    <textarea id="b-items" rows="5" placeholder='{"id": "1", "query": "Which company did Acme acquire in June 2026?", "answers": ["Bolt Systems"], "published": "2026-06-04"}'></textarea>
    <div class="row">
      <label>or a file <input type="text" id="b-items-path" placeholder="examples/dataset-company-news.jsonl" style="width:280px"></label>
      <label>first N items <input type="number" id="b-limit" min="1" placeholder="all"></label>
    </div>

    <h3>Systems</h3>
    <textarea id="b-cohort" rows="8" spellcheck="false">${esc(starterCohort())}</textarea>
    <div class="row">
      <label>or a file <input type="text" id="b-cohort-path" placeholder="examples/cohort-web-search.json" style="width:280px"></label>
      <label><input type="checkbox" id="b-baseline" checked> add the model-only row</label>
    </div>

    <div class="row">
      <button class="primary" id="test">Run the board</button>
      <span class="hint" id="test-hint"></span>
    </div>`;
}

function wireBenchmark() {
  const btn = $("test");
  if (!btn) return;
  btn.onclick = () => (isAgentic() ? benchmark(false) : board());
  if (healthState && healthState.has_key === false) {
    const mock = $("b-mock");
    if (mock) mock.checked = true;
  }
}

async function board() {
  const btn = $("test");
  const hint = $("test-hint");
  btn.disabled = true;
  btn.textContent = "Starting\u2026";
  banner("", "");

  const body = {
    cohort: $("b-cohort").value.trim() || null,
    cohort_path: $("b-cohort-path").value.trim() || null,
    dataset: $("b-items").value.trim() || null,
    dataset_path: $("b-items-path").value.trim() || null,
    dataset_name: (lastSpec && lastSpec.subject.name) || "items",
    limit: $("b-limit").value ? Number($("b-limit").value) : null,
    baseline: $("b-baseline").checked,
  };

  try {
    const r = await fetch("/api/board", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const job = await r.json();
    if (!r.ok) { banner("err", job.detail || `Could not start (${r.status})`); return; }
    hint.textContent = `${job.systems} system(s) x ${job.cases} item(s) \u2014 starting\u2026`;
    await pollBoard(job);
  } catch (e) {
    banner("err", `Could not reach the server: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "Run the board";
  }
}

async function pollBoard(job) {
  const hint = $("test-hint");
  while (true) {
    const r = await fetch(`/api/run/${job.job_id}`);
    const now = await r.json();
    if (!r.ok) { banner("err", now.detail || "Lost track of the board."); return; }
    if (now.state === "running") {
      hint.textContent = `${now.done} of ${now.total} call(s)` + (now.case_id ? ` \u2014 ${now.case_id}` : "");
      await new Promise(done => setTimeout(done, 900));
      continue;
    }
    if (now.state === "failed") {
      hint.textContent = "";
      banner("err", `The board failed: ${now.error}`);
      return;
    }
    hint.textContent = `written to ${now.path}`;
    const built = await fetch(`/api/boards/${encodeURIComponent(now.board_id)}`).then(x => x.json());
    renderBoardResult(built);
    $("runresult").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
}

const secs = (v) => v === null || v === undefined ? "&mdash;" : (v < 1 ? `${Math.round(v * 1000)}ms` : `${v.toFixed(2)}s`);
const usd = (v) => v === null || v === undefined ? "&mdash;" : `$${v.toFixed(4)}`;

function renderBoardResult(b) {
  const shown = b.rows.filter(r => !r.skipped);
  const skipped = b.rows.filter(r => r.skipped);
  const baseline = b.rows.find(r => r.kind === "model_only");
  const leader = shown.filter(r => r.kind !== "model_only" && r.accuracy !== null)
    .sort((x, y) => y.accuracy - x.accuracy)[0];

  const rows = table(
    ["System", "Endpoint &amp; configuration", "Accuracy", "AR@1", "AR@5", "p50", "p95", "Errors", "Total $", "$ / 1k correct"],
    shown.map(r => [
      esc(r.label) + (r.vendor && r.vendor !== r.label ? `<br><span class="why">${esc(r.vendor)}</span>` : ""),
      `<span class="why">${esc(r.configuration || "—")}</span>`,
      pct(r.accuracy), pct(r.recall_at_1), pct(r.recall_at_5),
      secs(r.seconds_p50), secs(r.seconds_p95), r.errors,
      usd(r.usd), usd(r.usd_per_1k_correct),
    ]));

  const notRun = skipped.length
    ? table(["System", "Why not"], skipped.map(r => [esc(r.label), `<span class="why">${esc(r.skipped)}</span>`]))
    : "";

  const c = b.contamination;
  const perItem = shown.map(r => `<details><summary>${esc(r.label)} — every item</summary>${
    table(["Item", "Right", "Rank", "Evidence"], r.verdicts.map(v => [
      esc(v.item_id),
      v.error ? '<span class="badge error">error</span>' : (v.correct ? '<span class="badge passed">yes</span>' : '<span class="badge failed">no</span>'),
      v.rank === null || v.rank === undefined ? "&mdash;" : v.rank,
      `<span class="why">${esc(v.error || v.evidence || v.note || "—")}</span>`]))}</details>`).join("");

  $("runresult").innerHTML = `
    <div class="verdict">
      <span class="badge ${leader ? "labelled_data" : "none_found"}">${leader ? pct(leader.accuracy) + " " + esc(leader.label) : "nothing scored"}</span>
      <strong>${esc(b.task || "Comparison")}: ${esc(b.dataset)}</strong>
      <span class="meta">${esc(b.board_id)}</span>
    </div>
    <table class="facts">
      <tr><th>Items</th><td>${b.items} &middot; <code>${esc(b.dataset_digest)}</code>${
        b.dataset_source ? ` &middot; ${esc(b.dataset_source)}` : ""}</td></tr>
      <tr><th>Held constant</th><td>model <code>${esc(b.model || "none")}</code>,
        judge <code>${esc(b.judge_model || "none")}</code> &mdash; only the system changes between rows</td></tr>
      <tr><th>Model only</th><td>${baseline && baseline.accuracy !== null
        ? `${pct(baseline.accuracy)} with no endpoint at all${baseline.accuracy > 0.1
            ? " &mdash; that much of this board is a memory test" : " &mdash; the answers cannot be recalled"}`
        : '<span class="none">not measured</span>'}</td></tr>
      ${c ? `<tr><th>Contamination</th><td>${words(c.verdict)} &middot; ${c.clean_cases} clean,
        ${c.unknown_cases} unknown, ${c.at_risk_cases} at risk${c.cutoff ? ` &middot; cutoff ${esc(c.cutoff)}` : ""}</td></tr>` : ""}
    </table>

    ${b.warnings.length ? `<details open><summary>${b.warnings.length} thing(s) to read before quoting a number</summary>${list(b.warnings, "")}</details>` : ""}

    <h2>The board <span class="why">alphabetical; no column decides the order</span></h2>${rows}
    ${notRun ? `<h2>Not run</h2>${notRun}` : ""}
    <details><summary>How it was measured</summary>${list(b.methodology, "not recorded")}</details>
    ${perItem}
    <details><summary>Board (JSON)</summary><pre>${esc(JSON.stringify(b, null, 2))}</pre></details>`;
  $("runresult").hidden = false;
}

async function benchmark(force) {
  if (!lastSpec) return;
  const btn = $("test");
  btn.disabled = true;
  btn.textContent = "Writing the suite\u2026";
  banner("", "");

  const body = {
    spec: lastSpec,
    force,
    samples: $("b-samples").value ? Number($("b-samples").value) : null,
    limit: $("b-limit").value ? Number($("b-limit").value) : null,
    split: $("b-split").value || null,
    mock: $("b-mock").checked,
  };

  try {
    const r = await fetch("/api/benchmark", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const job = await r.json();
    if (r.status === 409) {
      // The agent gate is closed: a suite written against an agent nobody can
      // start is a document, not a test. Say so, and let it be overridden.
      $("test-hint").innerHTML = `${esc(job.detail)}
        <button id="force">Write it anyway</button>`;
      $("force").onclick = () => benchmark(true);
      return;
    }
    if (!r.ok) { banner("err", job.detail || `Could not start (${r.status})`); return; }
    await pollRun(job);
  } catch (e) {
    banner("err", `Could not reach the server: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "Run the benchmark";
  }
}

async function pollRun(job) {
  const hint = $("test-hint");
  hint.textContent = `${job.cases} case(s) x ${Math.max(1, Math.round(job.total / Math.max(1, job.cases)))} sample(s) \u2014 starting\u2026`;
  while (true) {
    const r = await fetch(`/api/run/${job.job_id}`);
    const now = await r.json();
    if (!r.ok) { banner("err", now.detail || "Lost track of the run."); return; }
    if (now.state === "running") {
      hint.textContent = `${now.done} of ${now.total} run(s)` + (now.case_id ? ` \u2014 ${now.case_id}` : "");
      await new Promise(done => setTimeout(done, 700));
      continue;
    }
    if (now.state === "failed") {
      hint.textContent = "";
      banner("err", `The run failed: ${now.error}`);
      return;
    }
    hint.textContent = `${now.done} run(s) \u2014 written to ${now.path}`;
    const report = await fetch(`/api/runs/${encodeURIComponent(now.run_id)}`).then(x => x.json());
    renderRun(report, now);
    $("runresult").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
}

const pct = (v) => v === null || v === undefined ? '<span class="none">nothing settled</span>' : `${Math.round(v * 100)}%`;
const STATUS_WORD = { passed: "passed", failed: "failed", blocked: "nothing runnable", error: "never ran" };

function renderRun(r, job) {
  const checks = r.overall.checks;
  const spend = r.usage.usd === null || r.usage.usd === undefined ? "not priced" : `$${r.usage.usd.toFixed(4)}`;

  const splits = table(["Split", "Cases", "Runs", "Passed", "Failed", "Errors", "Pass rate"],
    [r.headline, r.dev, r.overall].map(s =>
      [esc(s.label), s.cases, s.runs, s.passed, s.failed, s.errors, pct(s.pass_rate)]));

  const kpis = table(["KPI", "Cases", "Passed", "Failed", "Blocked", "Pass rate"],
    r.by_kpi.map(g => [esc(g.label), g.cases, g.checks.passed, g.checks.failed,
      g.checks.blocked, pct(g.checks.pass_rate)]));

  const kinds = table(["Check kind", "Passed", "Failed", "Blocked", "Pass rate"],
    r.by_kind.map(g => [esc(g.label.replace(/_/g, " ")), g.checks.passed, g.checks.failed,
      g.checks.blocked, pct(g.checks.pass_rate)]));

  const reasons = new Map();
  r.cases.forEach(c => c.blocked.forEach(b => reasons.set(b.reason, (reasons.get(b.reason) || 0) + 1)));
  const blocked = reasons.size
    ? table(["Checks", "Why not"], [...reasons.entries()].sort((a, b) => b[1] - a[1])
        .map(([reason, n]) => [n, esc(reason)]))
    : `<p class="none">Every check ran.</p>`;

  const c = r.contamination;
  const contamination = c
    ? table(["Origin", "Cases", "Verdict", "Why"], c.by_origin.map(o =>
        [o.url ? link(o.url, o.source) : esc(o.source), o.cases,
         esc(o.verdict.replace(/_/g, " ")), `<span class="why">${esc(o.why)}</span>`]))
    : "";

  const failed = r.cases.filter(x => x.status !== "passed");
  const failures = failed.length
    ? table(["Case", "Behaviour", "Status", "Samples", "Failed checks", "Blocked"],
        failed.slice(0, 25).map(x => [
          `<code>${esc(x.case_id)}</code>`, esc(x.behaviour),
          `<span class="badge ${esc(x.status)}">${esc(STATUS_WORD[x.status] || x.status)}</span>`,
          `${x.passed}/${x.samples}`, x.checks_failed, x.checks_blocked]))
    : `<p class="none">Every case passed.</p>`;

  $("runresult").innerHTML = `
    <div class="verdict">
      <span class="badge ${r.headline.pass_rate === null ? "none_found" : "labelled_data"}">${pct(r.headline.pass_rate)} held out</span>
      <strong>${esc(r.subject)}</strong>
      <span class="meta">${esc(r.run_id)}${r.mock ? " &middot; dry run" : ""}</span>
    </div>
    <table class="facts">
      <tr><th>Ran</th><td>${r.overall.cases} case(s) x ${r.samples} sample(s) = ${r.overall.runs} run(s)
        against <code>${esc(r.model)}</code>${r.judge_model ? `, judged by <code>${esc(r.judge_model)}</code>` : ", no judge"}</td></tr>
      <tr><th>Checks</th><td>${checks.passed} passed &middot; ${checks.failed} failed &middot;
        <strong>${checks.blocked} could not run</strong> &middot; ${pct(checks.pass_rate)} of those that did</td></tr>
      <tr><th>Cost</th><td>${(r.usage.tokens || 0).toLocaleString()} tokens &middot; ${spend} &middot; ${Math.round(r.seconds)}s</td></tr>
      ${c ? `<tr><th>Contamination</th><td>${esc(c.verdict.replace(/_/g, " "))} &middot;
        ${c.clean_cases} clean, ${c.unknown_cases} unknown, ${c.at_risk_cases} at risk${
        c.cutoff ? ` &middot; cutoff ${esc(c.cutoff)}` : " &middot; no cutoff on file"}</td></tr>` : ""}
      <tr><th>Suite</th><td><code>${esc(r.suite_digest)}</code> &middot; ${esc(job ? job.suite : "")}</td></tr>
    </table>

    ${r.warnings.length ? `<details open><summary>${r.warnings.length} thing(s) to read before quoting a number</summary>${list(r.warnings, "")}</details>` : ""}

    <h2>Scores</h2>${splits}
    <h2>By KPI</h2>${kpis}
    <h2>What could not be checked</h2>${blocked}
    <h2>Cases that did not pass</h2>${failures}
    ${failed.length > 25 ? `<p class="why">${failed.length - 25} more in the dashboard.</p>` : ""}
    <details><summary>By check kind</summary>${kinds}</details>
    ${contamination ? `<details><summary>Where the cases came from</summary>${contamination}</details>` : ""}
    <p><a href="/dashboard?run=${encodeURIComponent(r.run_id)}" target="_blank" rel="noopener">Open this run in the dashboard</a>
      &mdash; every verdict, and the transcript it was read off.</p>`;
  $("runresult").hidden = false;
}

async function groundTruth() {
  if (!lastSpec) return;
  const btn = $("gt");
  btn.disabled = true;
  btn.textContent = "Searching\u2026";
  banner("", "");

  try {
    const r = await fetch("/api/ground-truth", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ spec: lastSpec }),
    });
    const body = await r.json();
    if (!r.ok) { banner("err", body.detail || `Request failed (${r.status})`); return; }
    renderReport(body);
    $("gtresult").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    banner("err", `Could not reach the server: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "Find ground truth";
  }
}

async function classify(text, answers, btn, busy, idle) {
  btn.disabled = true;
  btn.textContent = busy;
  banner("", "");

  try {
    const r = await fetch("/api/classify", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, answers }),
    });
    const body = await r.json();
    if (!r.ok) { banner("err", body.detail || `Request failed (${r.status})`); return; }
    lastText = text;
    answered = answers;
    render(body);
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    banner("err", `Could not reach the server: ${e.message}`);
  } finally {
    // The answer form is rebuilt by render(), so this only matters when the
    // button survived - a failed request, or the top-level Classify button.
    btn.disabled = false;
    btn.textContent = idle;
  }
}

async function run() {
  const text = $("input").value.trim();
  if (!text) { banner("err", "Type a request first."); return; }
  // Editing the request starts over; answers to the old one need not fit it.
  if (text !== lastText) answered = [];
  await classify(text, answered, $("go"), "Classifying\u2026", "Classify");
}

// Re-classify the original request with the answers appended. Whether the
// block clears is then the classifier's verdict on the answers, not ours.
async function submitAnswers() {
  if (!lastText) return;
  await classify(lastText, collectAnswers(), $("answer"),
    "Re-classifying\u2026", "Submit answers");
}

$("go").onclick = run;
$("example").onclick = () => { $("input").value = EXAMPLE; $("input").focus(); };
$("clear").onclick = () => {
  $("input").value = "";
  $("result").hidden = true;
  $("gtresult").hidden = true;
  $("exresult").hidden = true;
  $("runresult").hidden = true;
  lastSpec = null;
  lastReport = null;
  lastText = "";
  questions = [];
  answered = [];
  banner("", "");
};
$("input").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
});
health();
</script>
</body>
</html>
