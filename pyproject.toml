[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-eval"
version = "0.1.0"
description = "Turn a free-form request into a structured evaluation task spec."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
auto-eval = "auto_eval.cli:main"

[tool.setuptools.packages.find]
include = ["auto_eval*"]

[tool.setuptools.package-data]
auto_eval = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
